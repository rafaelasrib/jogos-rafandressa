function other(i){return 1-i}
function rand(n){if(n<=0)return 0;if(typeof crypto!=='undefined'&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function pick(arr,used=[]){if(!arr||!arr.length)return {index:-1,value:''};let available=arr.map((x,i)=>i).filter(i=>!used.includes(i));if(!available.length)available=arr.map((x,i)=>i);const index=available[rand(available.length)];return {index,value:arr[index]}}

g>${state.session?'Continuar partida':'Começar uma partida'}</strong><small>${state.session?esc(game(state.session.gameId)?.n||'Partida salva'):'Escolha um jogo na biblioteca'}</small></div></button></section><div class="section-head"><div><span class="eyebrow">Jogos em destaque</span><h2>Uma noite nunca é igual à outra</h2></div><button class="btn btn-sm btn-quiet" data-action="nav" data-to="library">Ver todos</button></div><section class="grid-cards">${['predict','draw','baker','challenge','quatro','romance'].map(id=>miniCard(game(id))).join('')}</section><div class="panel" style="margin-top:22px"><div class="section-head" style="margin:0 0 8px"><div><span class="eyebrow">Quem está com o aparelho?</span><h3>Selecionar jogadora</h3></div></div><div class="button-row">${[0,1].map(i=>`<button class="btn ${state.activePlayer===i?'':'btn-secondary'}" data-action="active-player" data-index="${i}">${state.activePlayer===i?'✓ ':''}${me(i)}</button>`).join('')}</div><small>Isso define quem começa uma partida nova. Durante os jogos, os turnos são alternados automaticamente.</small></div>`}
function libraryScreen(){let arr=GAMES.filter(g=>(ui.cat==='all'||ui.cat===g.cat)&&(ui.diff==='all'||String(g.dif)===ui.diff)&&(ui.duration==='all'||(ui.duration==='short'&&g.min<=10)||(ui.duration==='mid'&&g.min>10&&g.min<=20)||(ui.duration==='long'&&g.min>20)));return `<div class="section-head"><div><span class="eyebrow">Escolha o seu jogo</span><h2>Biblioteca de jogos</h2><p class="subdued">Cada jogo tem regras, conteúdo e funcionamento próprios.</p></div><span class="pill lavender">${arr.length} jogos</span></div><div class="category-chips"><button class="chip ${ui.cat==='all'?'selected':''}" data-action="filter-cat" data-id="all">Todos (${GAMES.length})</button>${CATEGORIES.map(c=>`<button class="chip ${ui.cat===c.id?'selected':''}" data-action="filter-cat" data-id="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div><div class="filter-bar"><label><span class="form-label">Dificuldade</span><select id="filter-diff" class="field" data-change="difficulty"><option value="all" ${ui.diff==='all'?'selected':''}>Todas</option><option value="1" ${ui.diff==='1'?'selected':''}>Leve</option><option value="2" ${ui.diff==='2'?'selected':''}>Média</option><option value="3" ${ui.diff==='3'?'selected':''}>Alta</option></select></label><label><span class="form-label">Duração estimada</span><select class="field" data-change="duration"><option value="all">Todas</option><option value="short" ${ui.duration==='short'?'selected':''}>Até 10 minutos</option><option value="mid" ${ui.duration==='mid'?'selected':''}>11 a 20 minutos</option><option value="long" ${ui.duration==='long'?'selected':''}>Mais de 20 minutos</option></select></label></div>${arr.length?`<div class="grid-cards">${arr.map(miniCard).join('')}</div>`:`<div class="empty-state"><span class="emoji">🧩</span>Nenhum jogo encontrado com esses filtros.<p><button class="btn btn-sm" data-action="reset-filters">Limpar filtros</button></p></div>`}`}
function detailScreen(){const g=game(ui.selectedGame)||game('draw');const c=category(g.cat);const isOngoing=state.session?.gameId===g.id;const caseExisting=g.kind==='case'&&state.cases[g.id]&&!state.cases[g.id].solved;return `<div class="backline"><button class="back-btn" data-action="nav" data-to="library">← Biblioteca</button><span class="subdued">${esc(c.name)}</span></div><section class="detail-hero"><div class="big-icon">${g.icon}</div><div><span class="eyebrow">${g.kind==='case'?'Dossiê investigativo':'The Couple Games'}</span><h2>${esc(g.n)}</h2><p class="subdued">${esc(g.desc)}</p><div class="detail-tags"><span class="pill">👥 2 jogadoras</span><span class="pill gold">⏱ ${g.min}+ min</span><span class="pill lavender">${g.dif===3?'Difícil':g.dif===2?'Médio':'Leve'}</span></div></div></section><section class="two-col"><div class="panel"><span class="eyebrow">Manual de jogo</span><h3 style="margin-top:9px">Como jogar</h3><ol class="rule-list">${g.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div><div class="panel"><span class="eyebrow">Antes de começar</span><h3 style="margin-top:9px">Prepare a partida</h3><div class="meta-list"><div class="meta-line">Participantes <strong>${me(0)} e ${me(1)}</strong></div><div class="meta-line">Materiais <strong>${esc(g.material)}</strong></div><div class="meta-line">Rodadas <strong>${g.kind==='case'?'Investigação em fases':state.settings.rounds}</strong></div><div class="meta-line">Início <strong>${me(state.activePlayer)}</strong></div><div class="meta-line">Pontuação <strong>${state.settings.scoring?'Ativa':'Desativada'}</strong></div></div>${BANK_GROUPS[g.bank]?`<div class="setting-field"><label class="form-label">Tipo de carta / pergunta</label><select class="field" data-change="prompt-filter" data-bank="${g.bank}"><option value="all">Misturar todas as categorias</option>${BANK_GROUPS[g.bank].map(x=>`<option value="${x.id}" ${state.settings.promptFilters?.[g.bank]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:''}<div class="button-row" style="margin-top:22px">${isOngoing||caseExisting?`<button class="btn btn-wide btn-gold" data-action="${isOngoing?'continue':'start'}" data-id="${g.id}">▶ Continuar investigação/partida</button>`:''}<button class="btn btn-wide" data-action="start" data-id="${g.id}">${isOngoing?'↻ Recomeçar':'▶ Iniciar partida'}</button></div>${g.kind==='case'?'<small>Ao recomeçar um dossiê, as anotações e pistas abertas desse caso são zeradas. O histórico de pontos anteriores permanece.</small>':''}</div></section>`}
function dailyKey(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dailyIndex(){const date=dailyKey();let h=0;for(const c of date)h=(h*31+c.charCodeAt(0))>>>0;return h%DATA.challenges.length}
function dailyScreen(){const date=dailyKey(),prompt=DATA.challenges[dailyIndex()];return `<div class="backline"><button class="back-btn" data-action="nav" data-to="home">← Início</button></div><div class="play-shell"><section class="case-cover"><span class="eyebrow">Uma surpresa por dia</span><h2>✦ Desafio do dia</h2><p>Desafio de ${esc(date)} · O mesmo para as duas, até a próxima data local.</p></section><div class="game-area" style="margin-top:19px"><div class="prompt-card reveal"><span class="prompt-symbol">🎁</span><strong>${esc(prompt)}</strong></div><p class="prompt-hint">Vale a regra de Aposta ou Desafio: 2 pontos por execução, sem penalidades.</p><div class="game-controls"><button class="btn" data-action="daily-start">Começar este desafio</button><button class="btn btn-secondary" data-action="nav" data-to="library">Outros jogos</button></div></div></div>`}
function defaultCaseProgress(){return {unlocked:0,seen:[],notes:'',hints:0,solved:false,answers:null,rationale:'',correct:0};}
function startGame(id,opts={}){const g=game(id);if(!g)return;if(state.session&&!opts.fromChamp&&!opts.force){if(!confirm(`Existe uma partida de ${game(state.session.gameId)?.n||'outro jogo'} em andamento. Substituir por ${g.n}?`))return}if(g.kind==='case'){if(opts.force||!state.cases[id]||state.cases[id].solved)state.cases[id]=defaultCaseProgress();state.session={gameId:id,stage:'case',isChamp:false};ui.caseView='files';ui.caseLevelView=state.cases[id].unlocked;save();nav('play');return}let rounds=opts.fromChamp?1:(opts.rounds||Number(state.settings.rounds)||6);state.session={gameId:id,round:0,rounds,turn:state.activePlayer,stage:'prompt',used:[],delta:[0,0],data:{},timer:{seconds:0,left:0,running:false,endAt:0},isChamp:!!opts.fromChamp};if(g.kind==='wheel'){state.session.stage='wheel-spin';state.session.wheelAngle=0;state.session.spins=0}else{makeRound(opts.daily?DATA.challenges[dailyIndex()]:null)}save();nav('play')}
function makeRound(override=null){const s=state.session,g=game(s?.gameId);if(!s||!g)return;s.data={};s.timer={seconds:0,left:0,running:false,endAt:0};if(g.kind==='wheel'){s.stage='wheel-spin';return}let pool=g.bank==='romance'?DATA.romance.filter(x=>Number(x.split('|').at(-1))<=state.settings.intensity):(DATA[g.bank]||[]);const subcat=state.settings.promptFilters?.[g.bank];const group=BANK_GROUPS[g.bank]?.find(x=>x.id===subcat);if(group){pool=group.pattern?pool.filter(x=>new RegExp(group.pattern,'i').test(x)):pool.slice(group.start,group.end)}let item;if(override){item=override;s.data.custom=true}else{const chosen=pick(pool,s.used);item=chosen.value;s.used.push(chosen.index)};if(g.bank==='romance')item=item.split('|')[0];if(g.bank==='portrait')item=item.replaceAll('{p}',state.names[other(s.turn)]);s.data.prompt=item;if(g.kind==='predict'){s.stage='predict-secret'}else if(g.kind==='vote'){s.stage='vote-first'}else if(g.kind==='truth'){s.stage='truth-compose'}else if(g.kind==='mission'){s.data.missions=[item,pick(DATA.missions,[DATA.missions.indexOf(item)]).value];s.data.missionRevealed=false;s.stage='mission-first-cover'}else if(g.kind==='code'){s.stage='code-compose';s.data.trials=[]}else if(g.kind==='liar'){s.stage='liar-compose'}else if(g.kind==='duo'){s.stage='duo-prompt';s.data.segment=0}else if(g.secret){s.stage='private-cover'}else{s.stage='prompt'}const seconds=(g.kind==='duo'?15:g.kind==='generic'?(g.id==='timed'?[30,45,60][s.round%3]:g.sec):0)||0;s.timer={seconds,left:seconds,running:false,endAt:0};}
function roundLabel(s){return `Rodada ${s.round+1} de ${s.rounds}`}
function renderProgress(s){return `<div class="progress-outer"><div class="progress-inner" style="width:${Math.round((s.round+1)/s.rounds*100)}%"></div></div>`}
function playerFlag(i,label='Sua vez'){return `<div class="turn-header"><span class="small-avatar">${esc(state.names[i].slice(0,1).toUpperCase())}</span><div><span>${esc(label)}</span><strong>${me(i)}</strong></div></div>`}
function timerHtml(s){if(!s.timer?.seconds||!state.settings.timer)return '';const secs=s.timer.running?Math.max(0,Math.ceil((s.timer.endAt-Date.now())/1000)):s.timer.left;return `<div class="timer-row"><span class="timer-ring">⏱</span><span class="timer-number ${secs<=10?'urgent':''}" data-timer-display>${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}</span><button class="btn btn-sm btn-quiet" data-action="${s.timer.running?'pause-timer':secs===0?'reset-timer':'start-timer'}">${s.timer.running?'⏸ Pausar':secs===0?'↻ Reiniciar':'▶ Iniciar'}</button></div>`}
function buttonNext(text='Próxima rodada'){return `<button class="btn btn-wide" data-action="next-round">${esc(text)} →</button>`}
function genericActions(g){const s=state.session;let a='';if(g.role==='guess'){a=`<button class="btn" data-action="award-round" data-index="${other(s.turn)}" data-points="correct">✅ Adivinhou!</button><button class="btn btn-secondary" data-action="award-round" data-index="-1" data-points="0">Não adivinhou</button>`}else if(g.role==='self'){a=`<button class="btn" data-action="award-round" data-index="${s.turn}" data-points="challenge">✓ Desafio cumprido</button><button class="btn btn-secondary" data-action="award-round" data-index="-1" data-points="0">Pular sem penalidade</button>`}else if(g.role==='winner'){a=`<button class="btn" data-action="award-round" data-index="0" data-points="correct">🏅 ${me(0)}</button><button class="btn" data-action="award-round" data-index="1" data-points="correct">🏅 ${me(1)}</button><button class="btn btn-secondary" data-action="award-round" data-index="-1" data-points="0">Empate</button>`}else{a='<button class="btn" data-action="award-round" data-index="-1" data-points="0">Concluir a obra conjunta</button>'}return `<div class="game-controls">${a}</div>`}
function genericPlay(g,s){if(s.stage==='private-cover'){return `<div class="privacy-lock"><div class="privacy-symbol">🙊</div><span class="eyebrow">Somente ${me(s.turn)}</span><h2>Uma carta reservada para você</h2><p>Peça para ${me(other(s.turn))} não olhar para a tela. Toque para ver o desafio.</p><button class="btn" data-action="private-reveal">🔓 Revelar minha carta</button></div>`}if(s.stage==='private-reveal'){return `${playerFlag(s.turn,'Só você pode ler')}<div class="prompt-card reveal"><small>Carta secreta</small><strong>${esc(s.data.prompt)}</strong></div><p class="prompt-hint">Memorize o conteúdo. Quando estiver pronta, esconda a carta antes de mostrar o celular.</p><div class="game-controls"><button class="btn" data-action="private-hide">🔒 Esconder e começar</button></div>`}if(s.stage==='private-hidden'){return `<div class="privacy-lock"><div class="privacy-symbol">🎭</div><h2>Carta escondida!</h2><p>${me(s.turn)} já viu o desafio. Agora podem desenhar, cantarolar ou fazer leitura labial. A outra não vê a resposta.</p></div>${timerHtml(s)}${genericActions(g)}`}
if(s.stage==='round-done'){return roundDoneScreen()}
return `${playerFlag(s.turn,g.role==='winner'?'Rodada de criatividade':g.id==='tribunal'?'Quem está no banco dos réus?':g.id==='duo'?'As duas jogam':'Chegou sua vez')}<div class="prompt-card reveal"><small>${g.id==='debate'?'Defenda a proposta':g.id==='music'?'Escolha uma música relacionada':g.id==='tribunal'?'Acusação':'Seu desafio'}</small><strong>${esc(s.data.prompt)}</strong></div>${timerHtml(s)}<p class="prompt-hint">${g.id==='draw'?'Desenho em papel, nunca na tela.':g.id==='debate'?`${me(s.turn)} defende, ${me(other(s.turn))} argumenta contra.`:g.id==='story'?'Cada uma cria sua própria versão.':g.id==='blind'?'Desenhem sem olhar para o papel.':'Divirtam-se. Qualquer atividade pode ser pulada sem penalidade.'}</p>${genericActions(g)}`}
function privacyScreen(title,body,button,action){return `<div class="privacy-lock"><div class="privacy-symbol">🔐</div><span class="eyebrow">Privacidade ativada</span><h2>${title}</h2><p>${body}</p><button class="btn btn-gold" data-action="${action}">${button} →</button></div>`}
function predictPlay(s){const a=s.turn,b=other(a);if(s.stage==='predict-secret')return `${playerFlag(a,'Responda em segredo')}<div class="prompt-card"><strong>${esc(s.data.prompt)}</strong></div><div class="inline-form"><label class="form-label" for="secret-answer">Resposta de ${me(a)}</label><textarea id="secret-answer" class="field" placeholder="Escreva uma resposta que só você deve ver..."></textarea><button class="btn" data-action="predict-save">🔒 Guardar minha resposta</button></div>`;if(s.stage==='predict-pass')return privacyScreen(`Passe o celular para ${me(b)}`,`A resposta de ${me(a)} está escondida. ${me(b)} vai tentar descobrir o que ela escreveu.`,'Já estou com o celular','predict-guess-stage');if(s.stage==='predict-guess')return `${playerFlag(b,'Adivinhe a resposta')}<div class="prompt-card"><strong>${esc(s.data.prompt)}</strong></div><div class="inline-form"><label class="form-label" for="guess-answer">O que ${me(a)} teria respondido?</label><textarea class="field" id="guess-answer" placeholder="Digite seu palpite..."></textarea><button class="btn" data-action="predict-guess-save">Revelar as duas respostas →</button></div>`;if(s.stage==='predict-reveal')return `<span class="eyebrow">Hora da verdade</span><h2>O palpite chegou perto?</h2><div class="choice-answer"><span><b>${me(a)} respondeu:</b><br>${esc(s.data.secret)}</span></div><div class="choice-answer"><span><b>${me(b)} imaginou:</b><br>${esc(s.data.guess)}</span></div><p class="subtle-note">As respostas livres são julgadas por vocês. Aceitem sinônimos e ideias equivalentes.</p><div class="game-controls"><button class="btn" data-action="award-round" data-index="${b}" data-points="correct">✓ Acertou (+1)</button><button class="btn btn-secondary" data-action="award-round" data-index="-1" data-points="0">Não acertou</button></div>`;return roundDoneScreen()}
function voteOptions(g){return g.vote==='person'?[state.names[0],state.names[1]]:String(state.session.data.prompt).replace(/\?$/,'').split(/\s+ou\s+/i).slice(0,2)}
function votePlay(g,s){const opts=voteOptions(g);if(s.stage==='vote-first'||s.stage==='vote-second'){const p=s.stage==='vote-first'?s.turn:other(s.turn);return `${playerFlag(p,'Seu voto é secreto')}<div class="prompt-card"><strong>${esc(s.data.prompt)}</strong></div><p class="prompt-hint">Escolha uma alternativa. Seu voto ficará escondido até a revelação.</p><div class="vote-grid">${opts.map((x,i)=>`<button class="vote-btn" data-action="vote" data-index="${i}"><span class="eyebrow">${g.vote==='person'?`Pessoa ${i+1}`:`Opção ${i?'B':'A'}`}</span><br>${esc(x)}</button>`).join('')}</div>`}if(s.stage==='vote-pass')return privacyScreen(`Agora é a vez de ${me(other(s.turn))}`,`O voto de ${me(s.turn)} foi guardado e não aparece nesta tela.`,'Escolher meu voto','vote-next');if(s.stage==='vote-reveal'){const same=s.data.votes[0]===s.data.votes[1];return `<span class="eyebrow">Votos revelados</span><h2>${same?'Vocês pensaram igual!':'Duas cabeças, duas escolhas'}</h2><div class="choice-answer"><span>${me(s.turn)}</span><strong>${esc(opts[s.data.votes[0]])}</strong></div><div class="choice-answer"><span>${me(other(s.turn))}</span><strong>${esc(opts[s.data.votes[1]])}</strong></div><p class="prompt-hint">Contem por que escolheram isso. ${same?'A concordância vale um ponto para cada uma.':'Sem pontos nesta rodada, mas a discussão promete.'}</p><div class="game-controls"><button class="btn" data-action="vote-finish">Concluir rodada →</button></div>`}return roundDoneScreen()}
function truthPlay(s){if(s.stage==='truth-compose')return `${playerFlag(s.turn,'Crie suas afirmações secretas')}<div class="prompt-card"><small>Tema sugerido</small><strong>${esc(s.data.prompt)}</strong></div><p class="prompt-hint">Duas frases devem ser verdadeiras e uma mentira. Escreva sem mostrar à outra.</p><div class="inline-form">${[0,1,2].map(i=>`<label><span class="form-label">Afirmação ${i+1}</span><input id="truth-${i}" maxlength="240" class="field" placeholder="Uma afirmação sobre você"></label>`).join('')}<label><span class="form-label">Qual afirmação é a mentira?</span><select class="field" id="truth-index"><option value="0">Primeira</option><option value="1">Segunda</option><option value="2">Terceira</option></select></label><button class="btn" data-action="truth-save">Guardar as três afirmações</button></div>`;if(s.stage==='truth-pass')return privacyScreen(`Passe o celular para ${me(other(s.turn))}`,'A mentira está marcada em segredo. Não mostre a tela anterior.','Pronta para investigar','truth-guess-stage');if(s.stage==='truth-guess')return `${playerFlag(other(s.turn),'Descubra qual é a mentira')}<span class="eyebrow">Duas verdades e uma mentira</span>${s.data.statements.map((t,i)=>`<div class="choice-answer"><span><strong>${i+1}.</strong> ${esc(t)}</span><button class="btn btn-sm" data-action="truth-vote" data-index="${i}">É mentira</button></div>`).join('')}<p class="prompt-hint">Pode fazer perguntas para tentar pegar contradições antes de votar.</p>`;if(s.stage==='truth-reveal')return `<div class="center"><div class="result-glyph">${s.data.guess===s.data.lie?'✅':'🃏'}</div><h2>${s.data.guess===s.data.lie?'Mentira descoberta!':'A mentira enganou!'}</h2><p>A frase inventada era a <b>${s.data.lie+1}ª</b>: “${esc(s.data.statements[s.data.lie])}”.</p></div><div class="game-controls"><button class="btn" data-action="truth-finish">Concluir rodada →</button></div>`;return roundDoneScreen()}
function missionPlay(s){const first=s.turn,second=other(first);if(s.stage==='mission-first-cover')return privacyScreen(`Missão confidencial de ${me(first)}`,'Somente a dona desta missão deve ler a carta.','Ver minha missão','mission-first-reveal');if(s.stage==='mission-first-show')return `${playerFlag(first,'Sua missão confidencial')}<div class="prompt-card reveal"><small>Operação secreta</small><strong>${esc(s.data.missions[0])}</strong></div><div class="game-controls"><button class="btn" data-action="mission-first-hide">Esconder e passar o celular →</button></div>`;if(s.stage==='mission-second-cover')return privacyScreen(`Missão confidencial de ${me(second)}`,`A missão de ${me(first)} está escondida. Agora somente ${me(second)} deve olhar.`,'Ver minha missão','mission-second-reveal');if(s.stage==='mission-second-show')return `${playerFlag(second,'Sua missão confidencial')}<div class="prompt-card reveal"><small>Operação secreta</small><strong>${esc(s.data.missions[1])}</strong></div><div class="game-controls"><button class="btn" data-action="mission-second-hide">Esconder e começar as missões</button></div>`;if(s.stage==='mission-running')return `<div class="center"><div class="result-glyph">🕵️‍♀️</div><h2>Duas missões em andamento</h2><p>Agora joguem, conversem ou façam outras atividades. Tentem cumprir seus objetivos sem revelá-los.</p><p class="subtle-note">O aplicativo não verifica missões no mundo real: vocês confirmam honestamente.</p></div><div class="game-controls"><button class="btn" data-action="mission-review">Revelar e conferir as missões</button></div>`;if(s.stage==='mission-review')return `<span class="eyebrow">Desfecho das operações</span><h2>Quem completou a missão?</h2>${s.data.missions.map((m,i)=>`<div class="choice-answer"><div><strong>${me(i===0?first:second)}</strong><p>${esc(m)}</p></div></div>`).join('')}<div class="game-controls"><button class="btn" data-action="mission-finish" data-outcome="both">✓ As duas cumpriram</button><button class="btn btn-secondary" data-action="mission-finish" data-outcome="first">✓ Só ${me(first)}</button><button class="btn btn-secondary" data-action="mission-finish" data-outcome="second">✓ Só ${me(second)}</button><button class="btn btn-quiet" data-action="mission-finish" data-outcome="none">Nenhuma cumpriu</button></div>`;return roundDoneScreen()}
function isCode(v){return /^\d{4}$/.test(v)&&new Set(v).size===4}
function codeFeedback(secret,guess){let pos=0,wrong=0;for(let i=0;i<4;i++){if(secret[i]===guess[i])pos++;else if(secret.includes(guess[i]))wrong++}return {pos,wrong}}
function codePlay(s){const first=s.turn,second=other(first);if(s.stage==='code-compose')return `${playerFlag(first,'Crie uma senha secreta')}<div class="prompt-card"><strong>${esc(s.data.prompt)}</strong></div><p class="prompt-hint">Use quatro algarismos DIFERENTES, incluindo zero se quiser. Não deixe sua parceira ver a senha.</p><div class="inline-form"><input class="field" id="code-secret" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="off" placeholder="Ex.: 5831"><button class="btn" data-action="code-save">🔒 Guardar código</button></div>`;if(s.stage==='code-pass')return privacyScreen(`Passe para ${me(second)}`,'A combinação numérica está protegida na tela. Você terá seis tentativas para quebrá-la.','Começar tentativa','code-guess-stage');if(s.stage==='code-guess')return `${playerFlag(second,'Quebre o código')}<p class="subdued">Quatro dígitos distintos. 🎯 Posição correta; ↔ dígito certo em posição diferente.</p><div class="panel" style="margin:15px 0">${s.data.trials.length?s.data.trials.map((t,i)=>`<div class="code-log"><b>${esc(t.guess)}</b><span class="code-result">🎯 ${t.pos} · ↔ ${t.wrong}</span></div>`).join(''):'<p class="center subdued">Nenhuma tentativa ainda.</p>'}</div><p class="center"><strong>Restam ${6-s.data.trials.length} tentativas</strong></p><div class="inline-form"><input id="code-guess" class="field" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="off" placeholder="Digite quatro dígitos diferentes"><button class="btn" data-action="code-try">Testar código</button></div>`;if(s.stage==='code-reveal')return `<div class="center"><div class="result-glyph">${s.data.solved?'🔓':'🔐'}</div><h2>${s.data.solved?'Código decifrado!':'Código protegido!'}</h2><p>O segredo era <strong style="letter-spacing:.3em;color:var(--gold);font-size:23px">${esc(s.data.secret)}</strong></p><p>${s.data.solved?`${me(second)} conseguiu em ${s.data.trials.length} tentativa(s).`:`${me(first)} conseguiu manter o segredo após seis palpites.`}</p></div><div class="game-controls"><button class="btn" data-action="code-finish">Concluir rodada →</button></div>`;return roundDoneScreen()}
function liarPlay(s){if(s.stage==='liar-compose')return `${playerFlag(s.turn,'Invente ou conte uma história')}<div class="prompt-card"><small>Tema</small><strong>${esc(s.data.prompt)}</strong></div><p class="prompt-hint">Escolha uma história real ou invente uma. Seja convincente; a investigadora pode fazer três perguntas orais.</p><div class="inline-form"><textarea class="field" id="liar-story" placeholder="Conte a história em até cinco linhas..."></textarea><label><span class="form-label">Essa história é:</span><select class="field" id="liar-true"><option value="true">Verdadeira</option><option value="false">Inventada</option></select></label><button class="btn" data-action="liar-save">Guardar história e segredo</button></div>`;if(s.stage==='liar-pass')return privacyScreen(`Passe para ${me(other(s.turn))}`,'O segredo é se a história é real ou inventada. A resposta está escondida.','Investigar','liar-guess-stage');if(s.stage==='liar-guess')return `${playerFlag(other(s.turn),'Faça até três perguntas')}<div class="prompt-card"><strong>${esc(s.data.story)}</strong></div><p class="prompt-hint">Agora decida: a história aconteceu ou foi inventada?</p><div class="game-controls"><button class="btn" data-action="liar-vote" data-answer="true">Aconteceu</button><button class="btn btn-secondary" data-action="liar-vote" data-answer="false">Foi inventada</button></div>`;if(s.stage==='liar-reveal')return `<div class="center"><div class="result-glyph">${s.data.guess===s.data.real?'🔎':'🎭'}</div><h2>${s.data.guess===s.data.real?'A detetive acertou!':'A narradora enganou!'}</h2><p>A história era <strong>${s.data.real?'VERDADEIRA':'INVENTADA'}</strong>.</p></div><div class="game-controls"><button class="btn" data-action="liar-finish">Concluir rodada</button></div>`;return roundDoneScreen()}
function duoPlay(s){if(s.stage==='round-done')return roundDoneScreen();return `<div class="center"><span class="eyebrow">Desenho cooperativo · ${s.data.segment+1}/3</span><h2>${s.data.segment%2===0?me(s.turn):me(other(s.turn))}, assuma o desenho!</h2></div><div class="prompt-card"><small>Grande tema</small><strong>${esc(s.data.prompt)}</strong></div>${timerHtml(s)}<p class="prompt-hint">${s.data.segment===0?'Comece a desenhar por 15 segundos. Não explique sua intenção.':s.data.segment===1?'Continue o traço da outra por 15 segundos.':'Último turno: invente um desfecho para o desenho.'} Usem papel e caneta.</p><div class="game-controls"><button class="btn" data-action="duo-next">${s.data.segment<2?'Próxima desenhista →':'Revelar obra concluída'}</button></div>`}
function roundDoneScreen(){const s=state.session;return `<div class="center"><div class="result-glyph">✨</div><h2>Rodada concluída!</h2><p>${s.data.lastReward||'Boa! Continuem quando quiserem.'}</p></div><div class="result-score"><div class="score-tile"><b>${s.delta[0]}</b><span>+ ${me(0)} na partida</span></div><div class="score-tile"><b>${s.delta[1]}</b><span>+ ${me(1)} na partida</span></div></div><div class="game-controls">${buttonNext(s.round+1>=s.rounds?'Ver resultado da partida':'Próxima rodada')}</div>`}
function wheelPlay(s){
 if(s.stage==='round-done') return roundDoneScreen();
 const enabled=state.settings.wheelEnabled||WHEEL_CATS;
 const wheel=`<div class="roulette-layout"><div><div class="wheel-wrap"><div class="wheel-pointer"></div><div class="wheel-disk ${s.stage==='wheel-spinning'?'spinning':''}" style="transform:rotate(${s.wheelAngle||0}deg)"></div><div class="wheel-center">✦</div></div><div class="center"><button class="btn btn-gold" data-action="wheel-spin" ${s.stage==='wheel-spinning'?'disabled':''}>${s.stage==='wheel-spinning'?'Girando...':'🎡 Girar a roleta!'}</button></div></div><div><span class="eyebrow">Dez setores, novas histórias</span><h2>Deixe a sorte escolher</h2><p class="subdued">As categorias ativas estão selecionadas abaixo. Desative as que não quiser jogar.</p><div class="selection-grid" style="margin-top:15px">${WHEEL_CATS.map(c=>`<label class="select-item"><input type="checkbox" data-change="wheel-cat" value="${esc(c)}" ${enabled.includes(c)?'checked':''}>${esc(c)}</label>`).join('')}</div></div></div>`;
 if(s.stage!=='wheel-result')return wheel;
 let mystery='';
 if(s.data.wheelRiddle){mystery='<p class="prompt-hint">Discuta a teoria antes de abrir a resposta.</p>';
  mystery+=s.data.wheelRiddleShown?`<div class="status-banner">${esc(s.data.wheelRiddle)}</div>`:'<div class="center"><button class="btn btn-secondary" data-action="wheel-riddle-reveal">Revelar resposta</button></div>';
 }
 return wheel+`<div class="game-area compact" style="margin-top:18px"><span class="eyebrow">🎯 Sorteado: ${esc(s.data.wheelCat)}</span><div class="prompt-card reveal" style="margin-top:12px"><strong>${esc(s.data.prompt)}</strong></div>${mystery}<div class="game-controls"><button class="btn" data-action="award-round" data-index="${s.turn}" data-points="challenge">✓ Concluí (+2)</button><button class="btn btn-secondary" data-action="award-round" data-index="-1" data-points="0">Pular sem penalidade</button></div></div>`;
}
function playScreen(){const s=state.session;if(!s)return `<div class="empty-state"><span class="emoji">🎲</span>Nenhuma partida ativa.<p><button class="btn" data-action="nav" data-to="library">Abrir biblioteca</button></p></div>`;const g=game(s.gameId);if(!g)return '<div>Jogo indisponível.</div>';if(g.kind==='case')return renderCase(g,s);return `<div class="play-shell"><div class="play-header"><button class="back-btn" data-action="leave-play">← Sair e salvar</button><span class="play-title">${g.icon} ${esc(g.n)}</span><button class="back-btn" data-action="restart-current" title="Reiniciar">↻</button></div><div class="button-row" style="justify-content:space-between"><span class="pill gold">${roundLabel(s)}</span><span class="pill">${esc(category(g.cat).name)}</span></div>${renderProgress(s)}<section class="game-area">${g.kind==='predict'?predictPlay(s):g.kind==='vote'?votePlay(g,s):g.kind==='truth'?truthPlay(s):g.kind==='mission'?missionPlay(s):g.kind==='code'?codePlay(s):g.kind==='liar'?liarPlay(s):g.kind==='wheel'?wheelPlay(s):g.kind==='duo'?duoPlay(s):genericPlay(g,s)}</section><div style="margin-top:15px">${scoreStrip()}</div></div>`}
function renderCase(g,s){const c=CASES[g.id],p=state.cases[g.id]||defaultCaseProgress();if(p.solved)return caseSolutionView(g,c,p);const view=ui.caseView;const seenCount=c.levels.flatMap(x=>x.items).filter(x=>p.seen.includes(x.id)).length;return `<div class="backline"><button class="back-btn" data-action="leave-play">← Salvar e sair</button><span class="pill gold">Dossiê em investigação</span></div><section class="case-cover"><span class="case-tag">◈ ARQUIVO CONFIDENCIAL · PARA INVESTIGADORAS</span><h2>${esc(c.title)}</h2><p>${esc(c.lead)}</p><div class="detail-tags"><span class="pill gold">Dificuldade alta</span><span class="pill">${seenCount} / ${c.levels.flatMap(x=>x.items).length} documentos analisados</span><span class="pill">${p.hints} de 3 dicas usadas</span></div></section><div class="category-chips">${[['files','📁 Dossiê'],['people','👤 Suspeitos'],['notes','✍ Anotações'],['hints','💡 Dicas'],['accuse','⚖ Acusar']].map(([id,name])=>`<button class="chip ${view===id?'selected':''}" data-action="case-view" data-id="${id}">${name}</button>`).join('')}</div>${view==='files'?caseFiles(c,p):view==='people'?casePeople(c):view==='notes'?caseNotes(p):view==='hints'?caseHints(c,p):caseAccuse(c,p)}<div style="margin-top:20px" class="status-banner">🔒 A resolução não aparece nos documentos. Só será revelada depois que vocês registrarem a acusação final. As anotações e o avanço ficam salvos neste navegador.</div>`}
function caseFiles(c,p){const lev=Math.min(ui.caseLevelView,p.unlocked);const section=c.levels[lev];return `<div class="panel" style="margin:17px 0"><span class="eyebrow">Apresentação do caso</span>${c.intro.map(t=>`<p class="prose" style="margin-top:11px">${esc(t)}</p>`).join('')}<details style="margin-top:14px"><summary style="color:var(--gold);cursor:pointer;font-weight:750">Abrir descrição espacial e planta da área</summary><p class="prose" style="padding-top:11px">${esc(c.map)}</p></details></div><div class="case-tabs">${c.levels.map((l,i)=>`<button class="case-tab ${lev===i?'active':''} ${i>p.unlocked?'locked':''}" data-action="case-level" data-index="${i}" ${i>p.unlocked?'disabled':''}>${i>p.unlocked?'🔒 ':i<p.unlocked?'✓ ':''}Fase ${i+1}<br>${esc(l.name.split('—').at(-1).trim().slice(0,30))}</button>`).join('')}</div><div class="section-head"><div><span class="eyebrow">Investigação • fase ${lev+1}</span><h2>${esc(section.name)}</h2><p class="subdued">${esc(section.description)}</p></div></div><div class="case-doc-grid">${section.items.map(doc=>`<button class="document-card ${p.seen.includes(doc.id)?'read':''}" data-action="case-open-doc" data-id="${doc.id}"><span class="doc-kind">📎 ${esc(doc.kind)}</span><strong>${esc(doc.title)}</strong>${p.seen.includes(doc.id)?'<span class="seen">✓ Documento examinado</span>':''}</button>`).join('')}</div><div class="button-row" style="margin-top:22px"><button class="btn btn-secondary" data-action="case-view" data-id="notes">✍ Abrir anotações</button>${p.unlocked<c.levels.length-1?`<button class="btn btn-gold" data-action="case-unlock">🔓 Liberar próxima fase</button>`:`<button class="btn" data-action="case-view" data-id="accuse">Preparar acusação →</button>`}</div><p class="subtle-note">As novas fases só são abertas quando vocês solicitam. Não é obrigatório ler todos os documentos, mas isso pode dificultar a solução.</p>`}
function casePeople(c){return `<div class="section-head"><div><span class="eyebrow">Perfis de investigação</span><h2>Pessoas de interesse</h2><p class="subdued">Motivos potenciais não são provas de autoria.</p></div></div><div class="suspect-grid">${c.characters.map(x=>`<article class="suspect"><span class="role">${esc(x.role)} · ${x.age} anos</span><h4>${esc(x.name)}</h4><p><strong>Motivo aparente:</strong> ${esc(x.motive)}</p><p><strong>Declaração:</strong> ${esc(x.statement)}</p><p><strong>Álibi alegado / observado:</strong> ${esc(x.alibi)}</p></article>`).join('')}</div><div class="button-row"><button class="btn btn-secondary" data-action="case-view" data-id="files">Voltar aos documentos</button><button class="btn" data-action="case-view" data-id="notes">Comparar e anotar</button></div>`}
function caseNotes(p){return `<div class="panel notebook"><span class="eyebrow">Diário da investigação</span><h2 style="margin:9px 0 14px">Sua teoria, suas pistas</h2><p class="subdued">Anotem horários, suspeitos, motivos, lacunas e explicações. O texto é salvo ao digitar.</p><label for="case-notes" class="form-label" style="margin:16px 0 7px">Caderno de campo</label><textarea class="field" id="case-notes" data-input="case-notes" placeholder="Linha do tempo...\nQuem ganha com o crime?\nQuais álibis dependem de registros automáticos?">${esc(p.notes)}</textarea><div class="button-row" style="margin-top:14px"><button class="btn btn-secondary" data-action="case-view" data-id="files">Voltar às evidências</button><button class="btn" data-action="case-view" data-id="accuse">Preparar acusação</button></div></div>`}
function caseHints(c,p){return `<div class="panel"><span class="eyebrow">Central de pistas</span><h2 style="margin:10px 0 8px">Dicas opcionais</h2><p class="subdued">Cada dica abre um nível de auxílio. Para ganhar o bônus de investigação perfeita, resolvam o caso sem utilizá-las.</p>${Array.from({length:p.hints},(_,i)=>`<div class="hint-item"><strong>Dica ${i+1} de 3</strong><p style="margin-top:6px">${esc(c.hints[i])}</p></div>`).join('')}${p.hints<3?`<div class="game-controls"><button class="btn" data-action="case-hint">💡 Solicitar dica ${p.hints+1} de 3</button></div>`:'<div class="status-banner">Todas as três dicas já foram reveladas.</div>'}<div class="button-row" style="margin-top:20px"><button class="btn btn-secondary" data-action="case-view" data-id="files">Reexaminar evidências</button></div></div>`}
const ACCUSATION_LABELS={culprit:'1. Quem cometeu o crime?',weapon:'2. Qual arma foi utilizada?',motive:'3. Qual foi o verdadeiro motivo?',method:'4. Como foi executado?',time:'5. Quando ocorreu?'};
function caseAccuse(c,p){return `<div class="panel"><span class="eyebrow">Etapa final do dossiê</span><h2 style="margin:9px 0">Apresentar acusação</h2><p class="subdued">Selecionem cinco conclusões e fundamentem a tese por escrito. A revelação ocorre apenas depois do envio. A decisão é final para esta tentativa.</p>${p.unlocked<2?`<div class="status-banner warning-banner">Vocês ainda não abriram todas as fases. É possível acusar agora, mas faltam provas importantes. <button class="btn btn-sm btn-quiet" data-action="case-view" data-id="files">Voltar</button></div>`:''}<div class="accusation-form" style="margin-top:20px">${Object.entries(c.accusation).map(([key,arr])=>`<label>${ACCUSATION_LABELS[key]}<select class="field" id="acc-${key}" required><option value="">Selecione uma hipótese...</option>${arr.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select></label>`).join('')}<label class="span-2">Justificativa da acusação <textarea class="field" id="acc-rationale" minlength="15" placeholder="Explique a sequência dos acontecimentos e cite ao menos duas evidências que sustentam a autoria...">${esc(p.rationale)}</textarea></label></div><div class="game-controls"><button class="btn btn-gold" data-action="case-submit">⚖ Registrar acusação e abrir a solução</button><button class="btn btn-secondary" data-action="case-view" data-id="notes">Voltar às anotações</button></div></div>`}
function caseSolutionView(g,c,p){const total=Object.keys(c.answer).length;const perfect=p.correct===total;return `<div class="play-shell"><div class="backline"><button class="back-btn" data-action="case-end">← Voltar ao início</button><span class="pill gold">Caso encerrado</span></div><section class="case-cover"><span class="eyebrow">Revelação oficial</span><h2>${esc(c.title)}</h2><p>Vocês concluíram a investigação. A seguir, a verificação de cada hipótese e a resolução completa.</p></section><div class="result-box" style="margin:17px 0"><div class="result-glyph">${perfect?'🏆':'🔍'}</div><h2>${perfect?'Investigação perfeita!':'O mistério foi revelado'}</h2><p><strong>${p.correct} de ${total}</strong> conclusões corretas · ${p.hints} dica(s) utilizada(s).</p><p class="subdued">${perfect&&p.hints===0?'Bônus de solução sem dicas conquistado!':perfect?'Vocês desvendaram o caso com auxílio das dicas.':'Confiram abaixo onde a teoria coincidiu — ou não — com as evidências.'}</p></div><div class="panel"><h3>⚖ Comparação da acusação</h3>${Object.entries(c.answer).map(([k,correct])=>`<div class="answer-row ${Number(p.answers?.[k])===correct?'correct':'wrong'}"><strong>${ACCUSATION_LABELS[k]} ${Number(p.answers?.[k])===correct?'✓':'✕'}</strong><small>Vocês: ${esc(c.accusation[k][p.answers?.[k]]||'Não informado')}</small><small>Correto: ${esc(c.accusation[k][correct])}</small></div>`).join('')}<h3 style="margin:19px 0 5px">Justificativa registrada</h3><p class="prose" style="font-size:13px">${esc(p.rationale)}</p></div><div class="section-head"><div><span class="eyebrow">A resposta oficial</span><h2>Reconstituição dos acontecimentos</h2></div></div>${c.solution.map((text,i)=>`<div class="solution-block"><strong style="color:var(--gold)">CAPÍTULO ${i+1}</strong><p style="margin-top:9px">${esc(text)}</p></div>`).join('')}<div class="game-controls" style="margin-top:23px"><button class="btn btn-secondary" data-action="case-end">Voltar ao início</button><button class="btn" data-action="case-replay" data-id="${g.id}">↻ Investigar novamente</button></div></div>`}
function streakFor(player){let max=0,current=0;for(const h of state.history){if(h.winner===player){current++;max=Math.max(max,current)}else{current=0}}return max}
function resultsScreen(){const last=state.history.slice().reverse();const leader=state.scores[0]===state.scores[1]?'Empate no placar':state.scores[0]>state.scores[1]?state.names[0]:state.names[1];return `<div class="section-head"><div><span class="eyebrow">A história de vocês</span><h2>Placares e resultados</h2><p class="subdued">Cada vitória conta uma história, mas alguns jogos são só pela diversão.</p></div><span class="pill gold">🏆 ${esc(leader)}</span></div>${scoreStrip()}<section class="stat-grid"><div class="stat-tile"><small>Partidas registradas</small><b>${state.history.length}</b><small>Inclui empates e cooperativos</small></div><div class="stat-tile"><small>Vitórias de ${me(0)}</small><b>${state.wins[0]}</b><small>Sequência máxima: ${streakFor(0)}</small></div><div class="stat-tile"><small>Vitórias de ${me(1)}</small><b>${state.wins[1]}</b><small>Sequência máxima: ${streakFor(1)}</small></div><div class="stat-tile"><small>Maior pontuação geral</small><b>${Math.max(...state.scores)}</b><small>Campeã: ${esc(leader)}</small></div></section><div class="panel"><div class="section-head" style="margin:0 0 8px"><div><span class="eyebrow">Arquivo de partidas</span><h3>Histórico</h3></div><button class="btn btn-sm btn-secondary" data-action="export-json">⬇ Exportar dados</button></div>${last.length?last.slice(0,50).map(h=>`<div class="history-item"><div><strong>${esc(h.gameName||'Partida')}</strong><small>${esc(new Date(h.date).toLocaleString('pt-BR'))} · ${h.winner===-1?'Empate / dupla':`Vitória de ${me(h.winner)}`}</small></div><span class="history-points">+${h.delta?.[0]||0} / +${h.delta?.[1]||0}</span></div>`).join(''):'<div class="empty-state"><span class="emoji">📚</span>Vocês ainda não concluíram nenhuma partida. A primeira vitória vem aí!</div>'}</div>`}
function settingsScreen(){const st=state.settings;return `<div class="section-head"><div><span class="eyebrow">Tudo do seu jeito</span><h2>Configurações</h2><p class="subdued">Os ajustes ficam salvos neste aparelho.</p></div></div><div class="settings-grid"><section class="panel"><h3>👥 Jogadoras</h3>${[0,1].map(i=>`<div class="setting-field"><label for="name-${i}">Nome da jogadora ${i+1}</label><input class="field" id="name-${i}" value="${me(i)}" maxlength="28" data-change="name" data-index="${i}" autocomplete="off"></div>`).join('')}<div class="setting-field"><label>Modo de jogo</label><select class="field" data-change="mode"><option value="shared" ${st.mode==='shared'?'selected':''}>Compartilhado — um celular por vez</option><option value="individual" ${st.mode==='individual'?'selected':''}>Individual — dados neste aparelho</option></select><p class="description">O modo individual não conecta aparelhos automaticamente. Para transferir uma partida, use exportar/importar JSON.</p></div></section><section class="panel"><h3>⚙️ Dinâmica da partida</h3><div class="setting-field"><label>Rodadas padrão</label><select class="field" data-change="rounds">${[2,4,6,8,10,15,20].map(v=>`<option value="${v}" ${st.rounds===v?'selected':''}>${v} rodadas</option>`).join('')}</select></div><div class="setting-field"><label>Nível romântico</label><select class="field" data-change="intensity"><option value="1" ${st.intensity===1?'selected':''}>1 · Leve</option><option value="2" ${st.intensity===2?'selected':''}>2 · Romântico</option><option value="3" ${st.intensity===3?'selected':''}>3 · Provocante, sem conteúdo explícito</option></select></div><label class="check-row"><input type="checkbox" data-change="timer" ${st.timer?'checked':''}> Exibir cronômetros</label><label class="check-row"><input type="checkbox" data-change="scoring" ${st.scoring?'checked':''}> Marcar pontos nas novas rodadas</label></section><section class="panel"><h3>🏅 Valores de pontos</h3>${[['correct','Acerto / vitória de rodada'],['challenge','Desafio cumprido'],['special','Código secreto'],['mystery','Mistério resolvido'],['bonus','Bônus mistério sem dicas']].map(([k,label])=>`<div class="setting-field"><label>${label}</label><input class="field" style="max-width:130px" type="number" min="0" max="20" step="1" value="${st.points[k]}" data-change="points" data-key="${k}"></div>`).join('')}</section><section class="panel"><h3>🎲 Categorias preferidas</h3><p class="subdued" style="font-size:13px">Utilizadas no sorteio “Surpreenda a gente” e no início dos campeonatos.</p>${CATEGORIES.map(c=>`<label class="check-row"><input type="checkbox" data-change="fav-cat" value="${c.id}" ${st.favCats.includes(c.id)?'checked':''}>${c.icon} ${esc(c.name)}</label>`).join('')}</section></div><section class="panel"><h3>💾 Salvamento e transferência</h3><p class="subdued">Partidas, placares, respostas em andamento e cadernos dos mistérios são salvos localmente no navegador. Para usar outro celular, exporte um arquivo JSON e importe no segundo aparelho.</p><div class="button-row" style="margin:17px 0"><button class="btn" data-action="export-json">⬇ Exportar meu progresso (.json)</button><button class="btn btn-secondary" data-action="import-select">⬆ Importar partida (.json)</button><button class="btn btn-quiet" data-action="fullscreen">⛶ Tela cheia</button></div><input hidden type="file" id="import-file" accept="application/json,.json"><div class="status-banner warning-banner">⚠ No iPhone, a pré-visualização do app Arquivos pode não executar o JavaScript corretamente. Abrir pelo Safari em uma página HTML estática tende a ser mais confiável. Arquivos HTML locais podem ter armazenamento separado conforme o navegador.</div><hr><button class="btn btn-danger" data-action="reset-all">Apagar todos os resultados e reiniciar</button></section>`}
const CHAMP_ELIGIBLE=['draw','blind','predict','probable','impossible','tribunal','challenge','lips','timed','romance','debate','music','story','liar'];
function championshipScreen(){const c=state.championship;if(c&&c.status!=='abandoned'){const done=c.idx>=c.plan.length;const d=[state.scores[0]-c.startScores[0],state.scores[1]-c.startScores[1]];const winner=d[0]===d[1]?-1:d[0]>d[1]?0:1;return `<div class="section-head"><div><span class="eyebrow">Modo campeonato</span><h2>${done?'Campeonato encerrado':'A disputa está acontecendo'}</h2></div></div>${done?`<div class="result-box"><div class="result-glyph">🏆</div><h2>${winner===-1?'Empate de campeãs!':`${me(winner)} venceu!`}</h2><p>Pontuação durante o campeonato: ${me(0)} +${d[0]} · ${me(1)} +${d[1]}</p><div class="game-controls"><button class="btn" data-action="champ-reset">Criar novo campeonato</button><button class="btn btn-secondary" data-action="nav" data-to="results">Ver placar geral</button></div></div>`:`<div class="panel"><p class="subdued">Prova <b>${c.idx+1}</b> de <b>${c.plan.length}</b>. ${state.session?.isChamp?'Há uma prova em andamento.':'Vocês podem iniciar a próxima prova.'}</p><div class="game-controls"><button class="btn" data-action="champ-next">${state.session?.isChamp?'Continuar prova':'▶ Iniciar próxima prova'}</button><button class="btn btn-danger" data-action="champ-abandon">Encerrar campeonato</button></div></div>`}<div class="panel" style="margin-top:18px"><h3>🗂️ Ordem das provas</h3>${c.plan.map((id,i)=>`<div class="champ-step ${i<c.idx?'done':i===c.idx&&!done?'current':''}"><span class="step-num">${i<c.idx?'✓':i+1}</span><div><strong>${game(id)?.icon||'🎲'} ${esc(game(id)?.n||'Desafio surpresa')}</strong><small>${i<c.idx?'Concluída':i===c.idx&&!done?'Próxima prova':'Aguardando'}</small></div></div>`).join('')}<p style="margin-top:14px" class="subdued">Parciais: ${me(0)} +${d[0]} · ${me(1)} +${d[1]}</p></div>`}return `<div class="section-head"><div><span class="eyebrow">Uma prova depois da outra</span><h2>🏆 Campeonato do casal</h2><p class="subdued">Combinem modalidades e disputem uma sequência de provas curtas. A maior pontuação ganha.</p></div></div><div class="two-col"><div class="panel"><h3>Configurar campeonato</h3><div class="setting-field"><label>Quantidade de provas</label><select class="field" id="champ-rounds"><option value="4">4 provas · rápido</option><option value="6" selected>6 provas · clássico</option><option value="8">8 provas · completo</option><option value="12">12 provas · maratona</option></select></div><label class="form-label" style="margin-top:14px">Categorias participantes</label><div class="selection-grid">${CATEGORIES.filter(c=>c.id!=='misterio').map(c=>`<label class="select-item"><input class="champ-cat" type="checkbox" value="${c.id}" ${state.settings.favCats.includes(c.id)?'checked':''}>${c.icon} ${esc(c.name)}</label>`).join('')}</div><p class="subtle-note">Os dossiês completos não entram neste modo, porque duram mais de uma hora. Podem ser jogados diretamente pela biblioteca.</p><div class="game-controls"><button class="btn btn-gold" data-action="champ-create">Criar campeonato →</button></div></div><div class="panel"><h3>Como funciona</h3><ol class="rule-list"><li>Escolham quantas provas desejam.</li><li>O sistema sorteia jogos das categorias habilitadas.</li><li>Joguem uma rodada de cada modalidade.</li><li>Os pontos vão para o placar e o jogo indica a campeã ao fim.</li></ol><div class="status-banner">🎁 A última prova é uma surpresa escolhida entre as categorias selecionadas.</div></div></div>`}
function matchResultScreen(){const r=state.lastMatch;if(!r)return '<p>Não há partida finalizada recentemente.</p>';const g=game(r.gameId);return `<div class="play-shell"><div class="backline"><button class="back-btn" data-action="nav" data-to="library">← Biblioteca</button></div><div class="result-box"><span class="eyebrow">Partida concluída</span><div class="result-glyph">🏆</div><h2>${r.winner===-1?'Foi um empate!':`${me(r.winner)} venceu!`}</h2><p>${esc(r.gameName)}</p><div class="result-score">${[0,1].map(i=>`<div class="score-tile"><span>${me(i)}</span><b>${r.delta[i]}</b><span>pontos nesta partida</span></div>`).join('')}</div><div class="game-controls"><button class="btn" data-action="start" data-id="${r.gameId}">↻ Jogar novamente</button><button class="btn btn-secondary" data-action="nav" data-to="library">Escolher outro jogo</button><button class="btn btn-quiet" data-action="nav" data-to="results">Ver todos os resultados</button></div></div></div>`}
function modalHtml(){if(!ui.modal)return '';const m=ui.modal;let body='';if(m.kind==='doc'){const c=CASES[state.session?.gameId];const doc=c?.levels.flatMap(x=>x.items).find(x=>x.id===m.id);if(!doc)return '';body=`<article class="paper-view"><span class="eyebrow">${esc(doc.kind)} · ARQUIVO DE EVIDÊNCIA</span><h3 style="margin-top:15px">${esc(doc.title)}</h3><hr style="border-color:#c7b8a8"><p>${esc(doc.body)}</p><div style="margin-top:30px;text-align:right;font-family:Georgia,serif">CONFIDENCIAL · Investigação em andamento</div></article>`}if(m.kind==='surprise'){body=`<p class="subdued">Escolha o tipo de surpresa e o sistema encontrará um jogo dentro das categorias preferidas.</p><div class="game-controls" style="margin-top:16px">${[['all','Todas as categorias'],['quick','Somente jogos rápidos'],['funny','Jogos engraçados'],['challenge','Somente desafios']].map(([id,n])=>`<button class="btn btn-secondary" data-action="surprise-pick" data-id="${id}">${n}</button>`).join('')}</div>`}return `<div class="modal-backdrop" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${m.kind==='doc'?'Documento de investigação':'Surpreenda a gente'}"><div class="modal-head"><span class="eyebrow">${m.kind==='doc'?'Arquivo aberto':'Sorteio aleatório'}</span><button class="modal-x" data-action="modal-close" aria-label="Fechar">×</button></div>${body}<div class="game-controls"><button class="btn btn-secondary" data-action="modal-close">Fechar</button></div></div></div>`}
// Core scoring and history
function addScore(index,kind='correct'){if(!state.settings.scoring)return 0;const n=Math.max(0,Number(kind==='0'?0:state.settings.points[kind]||0));if(index<0||index>1)return 0;state.scores[index]+=n;if(state.session?.delta)state.session.delta[index]+=n;return n;}
function addScoreBoth(kind){const a=addScore(0,kind),b=addScore(1,kind);return [a,b]}
function closeRound(message){const s=state.session;if(!s)return;s.stage='round-done';s.data.lastReward=message;s.timer.running=false;save();render();scrollTop()}
function awardRound(index,kind){const s=state.session;if(!s||s.stage==='round-done')return;const n=index>=0?addScore(index,kind):0;closeRound(n?`${state.names[index]} recebeu ${n} ponto(s)!`:'Sem pontos. O importante é a história que ficou!')}
function nextRound(){const s=state.session;if(!s||s.stage!=='round-done')return;if(s.round+1>=s.rounds){finishGame();return}s.round++;s.turn=other(s.turn);makeRound();save();render();scrollTop()}
function finishGame(){const s=state.session;if(!s)return;const delta=s.delta||[0,0];const winner=delta[0]===delta[1]?-1:delta[0]>delta[1]?0:1;const r={gameId:s.gameId,gameName:game(s.gameId)?.n||s.gameId,date:new Date().toISOString(),delta:[...delta],winner};state.history.push(r);if(winner>=0)state.wins[winner]++;state.lastMatch=r;const isChamp=s.isChamp;if(s.data?.custom){state.dailyCompleted=[...new Set([...state.dailyCompleted,dailyKey()])]};state.session=null;if(isChamp&&state.championship){state.championship.idx++;state.championship.status=state.championship.idx>=state.championship.plan.length?'done':'between';if(state.championship.status==='done'){const c=state.championship,d=[state.scores[0]-c.startScores[0],state.scores[1]-c.startScores[1]];const w=d[0]===d[1]?-1:d[0]>d[1]?0:1;state.history.push({gameId:'championship',gameName:'Campeonato do casal',date:new Date().toISOString(),delta:d,winner:w});if(w>=0)state.wins[w]++;confetti()}save();nav('championship');return}save();nav('matchresult');if(winner>=0)confetti()}
function confetti(){let old=document.querySelector('.confetti');if(old)old.remove();let e=document.createElement('div');e.className='confetti';for(let i=0;i<42;i++){const c=document.createElement('i');c.style.left=(rand(100))+'%';c.style.animationDelay=(rand(12)/10)+'s';c.style.animationDuration=(2+rand(20)/10)+'s';e.appendChild(c)}document.body.appendChild(e);clearTimeout(confettiTimeout);confettiTimeout=setTimeout(()=>e.remove(),4600)}
function setStage(stage){if(!state.session)return;state.session.stage=stage;save();render();scrollTop()}
function readInput(id){return document.getElementById(id)?.value?.trim()||''}
function must(v,msg){if(!v){showToast(msg);return false}return true}
function wheelPrompt(cat){let q='',answer=null;switch(cat){case 'Desenhe':q=pick(DATA.draw).value;break;case 'Responda':q=pick(DATA.predict).value;break;case 'Adivinhe':q=pick(DATA.lips).value;break;case 'Desafie':q=pick(DATA.challenges).value;break;case 'Imite':q=pick(DATA.challenges.filter(x=>/imite|imita|represent|finja|interprete|mímica/i.test(x))).value;break;case 'Aposte':q=pick(DATA.timed).value;break;case 'Seja romântica':q=pick(DATA.romance.filter(x=>Number(x.split('|').at(-1))<=Math.min(2,state.settings.intensity))).value.split('|')[0];break;case 'Seja provocante':q=pick(DATA.romance.filter(x=>Number(x.split('|').at(-1))===Math.min(3,state.settings.intensity))).value.split('|')[0];break;case 'Escolha impossível':q=pick(DATA.impossible).value;break;case 'Mistério':const p=pick(RIDDLES).value;q=p.q;answer=p.a;break;}return {prompt:q,wheelRiddle:answer}}
function spinWheel(){const s=state.session;if(!s||s.stage==='wheel-spinning')return;const cats=state.settings.wheelEnabled;if(!cats.length)return showToast('Ative pelo menos uma categoria.');const c=cats[rand(cats.length)];const idx=WHEEL_CATS.indexOf(c);const old=s.wheelAngle||0;const target=(360-((idx*36+18)%360))%360;const delta=((target-(old%360)+360)%360)+1800;s.wheelAngle=old;s.data={wheelCat:c,...wheelPrompt(c),wheelRiddleShown:false};s.stage='wheel-spinning';save();render();requestAnimationFrame(()=>{const el=document.querySelector('.wheel-disk');if(el)el.style.transform=`rotate(${old+delta}deg)`});clearTimeout(spinnerTimeout);spinnerTimeout=setTimeout(()=>{if(state.session!==s||s.stage!=='wheel-spinning')return;s.wheelAngle=old+delta;s.stage='wheel-result';save();render()},3150)}
function caseSubmit(){const s=state.session,c=CASES[s.gameId],p=state.cases[s.gameId];if(p.solved)return;let selections={};for(const k of Object.keys(c.answer)){const value=readInput('acc-'+k);if(!must(value,'Preencha todas as cinco hipóteses.'))return;selections[k]=Number(value)}const rationale=readInput('acc-rationale');if(!must(rationale.length>=15,'A justificativa precisa ter pelo menos 15 caracteres.'))return;if(!confirm('Enviar a acusação definitiva? A solução completa será revelada e este caso será encerrado.'))return;p.answers=selections;p.rationale=rationale;p.correct=Object.keys(c.answer).filter(k=>c.answer[k]===selections[k]).length;p.solved=true;let earned=[0,0];if(p.correct===5){earned=addScoreBoth('mystery');if(p.hints===0){const b=addScoreBoth('bonus');earned=[earned[0]+b[0],earned[1]+b[1]]}}state.history.push({gameId:s.gameId,gameName:c.title,date:new Date().toISOString(),delta:earned,winner:-1});s.stage='case-solution';save();render();scrollTop();if(p.correct===5)confetti()}
function createChampionship(){const rounds=Number(document.getElementById('champ-rounds')?.value)||6;const cats=[...document.querySelectorAll('.champ-cat:checked')].map(x=>x.value);if(!cats.length)return showToast('Escolha pelo menos uma categoria.');let eligible=CHAMP_ELIGIBLE.filter(id=>cats.includes(game(id).cat));if(!eligible.length)return showToast('Nenhum jogo compatível nessas categorias.');let bag=[],plan=[];for(let i=0;i<rounds;i++){if(!bag.length)bag=eligible.slice();let idx=rand(bag.length);plan.push(bag.splice(idx,1)[0])}if(state.session&&!confirm('Criar um campeonato substitui a partida em andamento. Continuar?'))return;state.session=null;state.championship={plan,idx:0,startScores:[...state.scores],status:'between'};save();render();showToast('Campeonato preparado!')}
function exportJSON(){const data=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);try{const b=new Blob([data],{type:'application/json;charset=utf-8'});const link=document.createElement('a');const url=URL.createObjectURL(b);link.href=url;link.download=`entre-nos-progresso-${dailyKey()}.json`;document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(url);link.remove()},1200);showToast('Arquivo de backup preparado.')}catch(e){showToast('Não foi possível exportar neste navegador.')}}
function importJSON(file){if(!file)return;if(file.size>5_000_000)return showToast('O arquivo é grande demais para um backup do jogo.');const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(String(reader.result));if(x.version!==1||!Array.isArray(x.names)||x.names.length!==2||!Array.isArray(x.scores)||x.scores.length!==2||!Array.isArray(x.history)||!x.settings)throw Error('Formato não reconhecido');if(!confirm('Importar este backup substituirá os dados locais atuais. Deseja continuar?'))return;const backup=defaults();state={...backup,...x,names:x.names.map(v=>String(v).slice(0,28)),scores:x.scores.map(v=>Math.max(0,Number(v)||0)),wins:Array.isArray(x.wins)?x.wins.map(v=>Number(v)||0):[0,0],settings:{...backup.settings,...x.settings,points:{...backup.settings.points,...x.settings.points},promptFilters:{...backup.settings.promptFilters,...x.settings.promptFilters}},history:x.history.slice(-500),cases:x.cases||{}};if(state.session?.stage==='wheel-spinning')state.session.stage='wheel-spin';save();nav('home');showToast('Progresso importado com sucesso!')}catch(e){showToast('Arquivo JSON inválido ou incompatível.')}};reader.onerror=()=>showToast('Falha ao ler o arquivo.');reader.readAsText(file,'UTF-8')}
function executeAction(action,el){const id=el.dataset.id,idx=Number(el.dataset.index),s=state.session,g=game(s?.gameId);switch(action){
 case 'nav':nav(el.dataset.to);return;
 case 'detail':ui.selectedGame=id;nav('detail');return;
 case 'continue':if(!state.session)return nav('library');ui.caseView='files';nav('play');return;
 case 'start':if(s?.gameId===id){if(!confirm('Recomeçar esta partida? A pontuação já conquistada não será desfeita.'))return;startGame(id,{force:true});return}startGame(id);return;
 case 'restart-current':if(!s)return;if(confirm('Recomeçar a partida atual? Pontos anteriores permanecem no placar.'))startGame(s.gameId,{force:true,fromChamp:!!s.isChamp});return;
 case 'leave-play':nav('home');showToast('Partida salva. Use “Continuar partida”.');return;
 case 'filter-cat':ui.cat=id;render();return;
 case 'reset-filters':ui.cat='all';ui.diff='all';ui.duration='all';render();return;
 case 'active-player':state.activePlayer=idx;save();render();return;
 case 'surprise':ui.modal={kind:'surprise'};render();return;
 case 'surprise-pick':{const fav=state.settings.favCats;let choices=GAMES.filter(x=>fav.includes(x.cat));if(id==='quick')choices=choices.filter(x=>x.min<=10);if(id==='funny')choices=choices.filter(x=>['draw','blind','duo','probable','impossible','truth','tribunal','challenge','timed','debate','story'].includes(x.id));if(id==='challenge')choices=choices.filter(x=>x.cat==='desafios');if(!choices.length)return showToast('Não há jogos com os filtros atuais. Habilite mais categorias.');ui.selectedGame=choices[rand(choices.length)].id;ui.modal=null;nav('detail');return;}
 case 'modal-close':ui.modal=null;render();return;
 case 'daily-start':startGame('challenge',{daily:true,rounds:1});return;
 case 'private-reveal':setStage('private-reveal');return;
 case 'private-hide':setStage('private-hidden');return;
 case 'predict-save':{const v=readInput('secret-answer');if(!must(v,'Escreva uma resposta antes de passar o aparelho.'))return;s.data.secret=v;setStage('predict-pass');return}
 case 'predict-guess-stage':setStage('predict-guess');return;
 case 'predict-guess-save':{const v=readInput('guess-answer');if(!must(v,'Digite seu palpite antes de revelar.'))return;s.data.guess=v;setStage('predict-reveal');return}
 case 'vote':{if(s.stage==='vote-first'){s.data.votes=[idx];setStage('vote-pass')}else if(s.stage==='vote-second'){s.data.votes[1]=idx;setStage('vote-reveal')}return}
 case 'vote-next':setStage('vote-second');return;
 case 'vote-finish':{let award='As escolhas foram diferentes.';if(s.data.votes[0]===s.data.votes[1]){const values=addScoreBoth('correct');award=`Vocês concordaram e ganharam ${values[0]} ponto(s) cada!`}closeRound(award);return}
 case 'truth-save':{let values=[0,1,2].map(i=>readInput('truth-'+i));if(!values.every(x=>x.length>=2))return showToast('Escreva as três afirmações.');s.data.statements=values;s.data.lie=Number(readInput('truth-index'));setStage('truth-pass');return}
 case 'truth-guess-stage':setStage('truth-guess');return;
 case 'truth-vote':{s.data.guess=idx;const winner=idx===s.data.lie?other(s.turn):s.turn;const earned=addScore(winner,'correct');s.data.revealReward=`${state.names[winner]} ganhou ${earned} ponto(s).`;setStage('truth-reveal');return}
 case 'truth-finish':closeRound(s.data.revealReward);return;
 case 'mission-first-reveal':setStage('mission-first-show');return;
 case 'mission-first-hide':setStage('mission-second-cover');return;
 case 'mission-second-reveal':setStage('mission-second-show');return;
 case 'mission-second-hide':setStage('mission-running');return;
 case 'mission-review':setStage('mission-review');return;
 case 'mission-finish':{const out=el.dataset.outcome;let people=[];if(['first','both'].includes(out))people.push(s.turn);if(['second','both'].includes(out))people.push(other(s.turn));people.forEach(i=>addScore(i,'challenge'));closeRound(people.length?`${people.map(i=>state.names[i]).join(' e ')} concluíram suas missões!`:'Missões reveladas. Sem penalidades.');return}
 case 'code-save':{const v=readInput('code-secret');if(!isCode(v))return showToast('Use quatro algarismos todos diferentes.');s.data.secret=v;setStage('code-pass');return}
 case 'code-guess-stage':setStage('code-guess');return;
 case 'code-try':{const v=readInput('code-guess');if(!isCode(v))return showToast('O palpite exige quatro dígitos diferentes.');const f=codeFeedback(s.data.secret,v);s.data.trials.push({guess:v,...f});if(f.pos===4||s.data.trials.length>=6){s.data.solved=f.pos===4;s.data.reward=s.data.solved?addScore(other(s.turn),'special'):0;setStage('code-reveal')}else{save();render()}return}
 case 'code-finish':closeRound(s.data.solved?`${state.names[other(s.turn)]} ganhou ${s.data.reward} ponto(s) ao decifrar!`:'A senha resistiu às tentativas.');return;
 case 'liar-save':{const v=readInput('liar-story');if(!must(v.length>=10,'Conte uma história com pelo menos 10 caracteres.'))return;s.data.story=v;s.data.real=readInput('liar-true')==='true';setStage('liar-pass');return}
 case 'liar-guess-stage':setStage('liar-guess');return;
 case 'liar-vote':{s.data.guess=el.dataset.answer==='true';const winner=s.data.guess===s.data.real?other(s.turn):s.turn;s.data.rewardName=state.names[winner];s.data.reward=addScore(winner,'correct');setStage('liar-reveal');return}
 case 'liar-finish':closeRound(`${s.data.rewardName} ganhou ${s.data.reward} ponto(s).`);return;
 case 'duo-next':{if(s.data.segment<2){s.data.segment++;s.timer={seconds:15,left:15,running:false,endAt:0};save();render()}else closeRound('Obra coletiva concluída! Podem dar um título a ela.');return}
 case 'award-round':awardRound(idx,el.dataset.points||'0');return;
 case 'next-round':nextRound();return;
 case 'wheel-spin':spinWheel();return;
 case 'wheel-riddle-reveal':s.data.wheelRiddleShown=true;save();render();return;
 case 'start-timer':if(!s?.timer||!s.timer.seconds)return;s.timer.running=true;s.timer.endAt=Date.now()+s.timer.left*1000;save();render();return;
 case 'pause-timer':if(!s?.timer)return;s.timer.left=Math.max(0,Math.ceil((s.timer.endAt-Date.now())/1000));s.timer.running=false;save();render();return;
 case 'reset-timer':if(!s?.timer)return;s.timer.left=s.timer.seconds;s.timer.running=false;save();render();return;
 case 'case-view':ui.caseView=id;render();scrollTop();return;
 case 'case-level':ui.caseLevelView=Math.min(idx,state.cases[s?.gameId]?.unlocked||0);render();return;
 case 'case-unlock':{const p=state.cases[s.gameId];p.unlocked=Math.min(2,p.unlocked+1);ui.caseLevelView=p.unlocked;save();render();scrollTop();return}
 case 'case-open-doc':{const p=state.cases[s.gameId];if(!p.seen.includes(id))p.seen.push(id);ui.modal={kind:'doc',id};save();render();return}
 case 'case-hint':{const p=state.cases[s.gameId];p.hints=Math.min(3,p.hints+1);save();render();return}
 case 'case-submit':caseSubmit();return;
 case 'case-end':state.session=null;save();nav('home');return;
 case 'case-replay':if(confirm('Iniciar uma nova investigação? As anotações antigas desse caso serão apagadas.'))startGame(id,{force:true});return;
 case 'champ-create':createChampionship();return;
 case 'champ-next':{const c=state.championship;if(!c||c.idx>=c.plan.length)return;if(state.session?.isChamp)return nav('play');if(state.session){if(!confirm('Substituir a partida atual para continuar o campeonato?'))return;state.session=null;}startGame(c.plan[c.idx],{fromChamp:true,force:true});return}
 case 'champ-abandon':if(!confirm('Encerrar o campeonato atual sem concluir todas as provas?'))return;if(state.session?.isChamp)state.session=null;state.championship=null;save();render();return;
 case 'champ-reset':state.championship=null;save();render();return;
 case 'export-json':exportJSON();return;
 case 'import-select':document.getElementById('import-file')?.click();return;
 case 'fullscreen':{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen){el.requestFullscreen().catch(()=>showToast('Tela cheia indisponível neste navegador.'))}else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});else showToast('Tela cheia não está disponível neste aparelho.');return}
 case 'reset-all':{if(!confirm('Isso apagará partidas, placares, configurações e investigações salvas NESTE navegador. Tem certeza?'))return;if(!confirm('Última confirmação: apagar definitivamente todos os dados locais?'))return;state=defaults();save();nav('home');showToast('Dados locais reiniciados.');return}
 }}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;try{executeAction(b.dataset.action,b)}catch(err){console.error('Action error',b.dataset.action,err);showToast('Ocorreu um problema nesta ação. Tente novamente.')}});
root.addEventListener('change',e=>{const el=e.target,t=el.dataset.change;if(!t)return;try{if(t==='difficulty')ui.diff=el.value;else if(t==='duration')ui.duration=el.value;else if(t==='name'){const val=el.value.trim().replace(/\s+/g,' ').slice(0,28);if(!val)return showToast('O nome não pode ficar vazio.');state.names[Number(el.dataset.index)]=val}else if(t==='mode')state.settings.mode=el.value;else if(t==='prompt-filter')state.settings.promptFilters[el.dataset.bank]=el.value;else if(t==='rounds')state.settings.rounds=Number(el.value);else if(t==='intensity')state.settings.intensity=Number(el.value);else if(t==='timer'||t==='scoring')state.settings[t]=el.checked;else if(t==='points')state.settings.points[el.dataset.key]=Math.max(0,Math.min(20,Number(el.value)||0));else if(t==='wheel-cat'){let a=state.settings.wheelEnabled;if(el.checked){if(!a.includes(el.value))a.push(el.value)}else{if(a.length===1){el.checked=true;return showToast('Mantenha pelo menos uma categoria ativa.')}state.settings.wheelEnabled=a.filter(x=>x!==el.value)}}else if(t==='fav-cat'){let a=state.settings.favCats;if(el.checked){if(!a.includes(el.value))a.push(el.value)}else{if(a.length===1){el.checked=true;return showToast('Mantenha pelo menos uma categoria preferida.')}state.settings.favCats=a.filter(x=>x!==el.value)}}save();if(!['wheel-cat'].includes(t))render()}catch(err){console.error(err);showToast('Não foi possível salvar esta configuração.')}});
root.addEventListener('input',e=>{const el=e.target;if(el.dataset.input==='case-notes'&&state.session){state.cases[state.session.gameId].notes=el.value;save()}});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.brand')){e.preventDefault();nav('home')}});
root.addEventListener('change',e=>{if(e.target.id==='import-file'){importJSON(e.target.files?.[0]);e.target.value=''}});
function timerTick(){const s=state.session;if(!s?.timer?.running)return;const left=Math.max(0,Math.ceil((s.timer.endAt-Date.now())/1000));if(left===s.timer.left&&left!==0)return;s.timer.left=left;const display=document.querySelector('[data-timer-display]');if(display){display.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;display.classList.toggle('urgent',left<=10)}if(left===0){s.timer.running=false;save();if(ui.screen==='play')render();showToast('⏱ Tempo encerrado! Confirmem o resultado da rodada.')}
}
setInterval(timerTick,250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')timerTick()});
if(state.session?.stage==='wheel-spinning'){state.session.stage='wheel-spin';save()}
const originalRender=render;
// Exibir uma tela independente de resultado após a última rodada.
function showScreen(){const s=ui.screen;if(s==='matchresult'){root.innerHTML=header()+`<main class="screen">${matchResultScreen()}</main>`+footer()+mobileNav()+modalHtml();renderToast();return}originalRender()}
// render encapsulates all other views; add the new view via a lightweight screen switch.
render=showScreen;
render();

</script>
</body>
